let face=type==='sleep'?'':'<circle cx="156" cy="140" r="4" fill="#22223c" stroke="none"/><circle cx="190" cy="140" r="4" fill="#22223c" stroke="none"/><path d="M158 157Q173 173 189 157" fill="none"/>';return `<figure class="comic-frame"><svg class="comic" viewBox="0 0 340 245" role="img" aria-label="${bubble}" xmlns="http://www.w3.org/2000/svg"><rect width="340" height="245" fill="${bg}"/><g fill="#fff" opacity=".45"><circle cx="37" cy="51" r="5"/><circle cx="295" cy="192" r="7"/><path d="M284 38L289 49L302 53L289 57L284 69L279 57L267 53L279 49Z"/></g><g stroke="#22223c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${thing}${face}</g></svg><figcaption class="comic-caption">${bubble}</figcaption></figure>`}
const sort=[['sleep','Mondurlaub im Schlaf!','Du schläfst und fliegst zum Mond.',['Nachttraum','Tagtraum','Wunschtraum'],0,'Nachttraum = Erleben im Schlaf.'],['pizza','Pizza kann fliegen?!','Im Bus stellst du dir wach eine fliegende Pizza vor.',['Albtraum','Tagtraum','Luzider Traum'],1,'Tagtraum = Fantasie, während du wach bist.'],['king','Mein großes Ziel!','Du wünschst dir, später ein Tierheim zu eröffnen.',['Nachttraum','Albtraum','Wunschtraum'],2,'Wunschtraum = etwas, das du dir sehr wünschst.'],['monster','Huch! Wer raschelt da?','Ein gruseliges Monster verfolgt dich im Schlaf.',['Albtraum','Wunschtraum','Tagtraum'],0,'Albträume sind unangenehme Nachtträume.'],['pizza','Moment … ich träume!','Im Schlaf merkst du: Das hier ist ein Traum.',['Tagtraum','Luzider Traum','Wunschtraum'],1,'Luzid = im Traum wissen, dass man träumt.']];
const tf=[['monster','Monster morgen?','Ein Albtraum sagt sicher die Zukunft voraus.',['✓ Wahr','✗ Quatsch'],1,'Ein Albtraum ist keine sichere Vorhersage.'],['pizza','Traum-Fernbedienung?','Bei luziden Träumen kann man immer alles steuern.',['✓ Wahr','✗ Quatsch'],1,'Man erkennt den Traum. Kontrolle ist nicht garantiert.'],['king','Ein Wunsch macht Mut!','Wunschträume können uns zu einem Ziel motivieren.',['✓ Wahr','✗ Quatsch'],0,'Ein Wunsch kann ein Ziel zeigen. Handeln hilft beim Umsetzen.'],['sleep','Schaum im Kopf?','„Träume sind Schäume“ heißt: Träume sind flüchtig oder wenig verlässlich.',['✓ Wahr','✗ Quatsch'],0,'Die Redewendung zweifelt am Wert oder an der Verlässlichkeit von Träumen.'],['butterfly','Mein Kopfkino, meine Regeln?','Bewusstes Denken lässt sich oft gezielter lenken als ein Nachttraum.',['✓ Wahr','✗ Quatsch'],0,'Beim Denken kannst du zum Beispiel gezielt einen Plan entwickeln.']];
const head=[["butterfly", "Mensch oder Schmetterling?", "Ein Traum fühlt sich ganz echt an. Was ist die vorsichtigste Schlussfolgerung?", ["Dann ist bestimmt alles ein Traum.", "Ein echtes Gefühl allein beweist nicht, dass ich wach bin.", "Echte Gefühle gibt es nur im Wachzustand."], 1, "Auch im Traum können Gefühle und Eindrücke echt wirken. Das beweist aber nicht, dass alles ein Traum ist."], ["king", "Krone auf. Schule anders!", "Du wünschst dir nur noch Pausen. Einige Kinder möchten auch Neues lernen. Welche Überlegung berücksichtigt beide Wünsche?", ["Niemand darf mehr lernen.", "Nur mein eigener Wunsch zählt.", "Mehr Erholung ermöglichen und trotzdem Lernzeit erhalten."], 2, "Ein Wunsch kann eine gute Idee anstoßen. Prüfe auch die Folgen und Bedürfnisse anderer."], ["nose", "Die Nase übernimmt!", "Eine Stadt hat nur Duftschilder. Bei Wind vermischen sich die Gerüche. Was wäre eine hilfreiche Ergänzung?", ["Tastbare Zeichen und hörbare Ansagen.", "Die Düfte stärker vermischen.", "Alle anderen Orientierungshilfen entfernen."], 0, "Weitere Hilfen verringern die Abhängigkeit von einem einzigen Sinn."], ["pizza", "Eine ziemlich verrückte Idee", "Du träumst von einem fliegenden Fahrrad. Es ist kein fertiger Bauplan. Kann die Idee trotzdem nützlich sein?", ["Nein, nur sofort umsetzbare Ideen sind nützlich.", "Ja, sie kann zum Nachdenken über bessere Wege anregen.", "Ja, jedes geträumte Fahrrad kann wirklich fliegen."], 1, "Fantasie kann neue Fragen und Ideen anstoßen. Eine Umsetzung muss trotzdem geprüft werden."], ["monster", "Monster im Kopfkino", "Nach einem Albtraum sagt jemand: „Das passiert morgen wirklich!“ Welche Antwort passt?", ["Jeder Traum ist eine sichere Vorhersage.", "Angst beweist, dass das Monster echt ist.", "Der Traum kann Angst machen, ist aber keine sichere Vorhersage."], 2, "Die Gefühle können echt sein, ohne dass die Traumgeschichte wirklich eintreten muss."]];
const experts=[
{title:'Fall 1 · Der perfekte Realitäts-Test',paragraphs:['Nila träumt, dass sie im Klassenzimmer sitzt. Sie liest die Uhr, fühlt die Tischplatte und hört ihren Freund sprechen. Alles wirkt gewöhnlich. Dann wacht sie auf: Die ganze Szene war ein Traum. Beim Frühstück beschließt sie: „Wenn ich etwas deutlich sehe und anfassen kann, bin ich bestimmt wach.“','Ben widerspricht: „Genau das hast du doch auch im Traum erlebt!“ Nila fragt sich, ob ein hilfreiches Alltagszeichen dasselbe ist wie ein Beweis, der niemals täuschen kann.'],questions:[['Welche Antwort trifft Bens Einwand am besten?',['Deutliche Eindrücke beweisen immer, dass man wach ist.','Auch klare Sinneseindrücke können in einem Traum auftreten.','Nach einem echten Aufwachen sind alle Erinnerungen falsch.'],1,'Nila hatte die deutlichen Eindrücke gerade im Traum. Darum reichen sie als unfehlbarer Beweis nicht aus.'],['Welche Schlussfolgerung ist durch den Fall gestützt?',['Es gibt überhaupt keine Wirklichkeit.','Nila träumt ab jetzt ständig.','Ihr vorgeschlagener Test ist nicht unfehlbar.'],2,'Ein Gegenbeispiel widerlegt diesen Test. Es beweist weder, dass es keine Wirklichkeit gibt, noch dass Nila immer träumt.']]},
{title:'Fall 2 · Der Traum-Regisseur',paragraphs:['Im Schlaf steht Omar auf einem fliegenden Bus. Er merkt plötzlich: „Busse fliegen nicht. Ich träume!“ Er möchte den Bus in einen Drachen verwandeln. Doch er bleibt ein Bus. Omar kann zwar entscheiden, wohin er schauen möchte, aber die Traumwelt gehorcht ihm nicht vollständig.','Am nächsten Morgen sagt jemand: „Dann war das kein luzider Traum. Luzid ist ein Traum nur, wenn du alles kontrollierst.“ Omar unterscheidet dagegen zwischen dem Erkennen des Traums und dem Steuern seines Inhalts.'],questions:[['Welche Beschreibung passt zu Omars Erlebnis?',['Luzider Traum, weil er im Traum den Traum erkennt.','Tagtraum, weil er eine Entscheidung trifft.','Kein Traum, weil er merkt, was geschieht.'],0,'Luzides Träumen setzt das Erkennen des Traumzustands voraus, nicht die vollständige Kontrolle.'],['Welche Behauptung widerlegt Omars Beispiel?',['Menschen können sich nachher an Träume erinnern.','Luzide Träume garantieren vollständige Kontrolle.','Im Traum können unmögliche Dinge geschehen.'],1,'Omar erkennt den Traum, kann aber nicht alles verändern. Das ist ein Gegenbeispiel zur behaupteten Garantie.']]},
{title:'Fall 3 · Eine Krone für alle?',paragraphs:['Jule träumt davon, Königin ihrer Schule zu sein. Ihre erste Regel: Niemand muss mehr Hausaufgaben machen. Viele jubeln. Einige Kinder finden jedoch, dass kurze Übungen ihnen helfen. Andere wünschen sich mehr Zeit für Sport, Musik oder ihre Familie. Jule möchte niemanden benachteiligen.','Sie ersetzt ihre erste Idee durch einen Vorschlag: Es gibt kurze freiwillige Übungen, Zeit zum Üben in der Schule und Hilfe bei Schwierigkeiten. Sie fragt die Klasse, ob das die verschiedenen Bedürfnisse besser berücksichtigt.'],questions:[['Welcher Gedankenschritt macht Jules zweiten Vorschlag stärker?',['Sie erklärt jeden Wunsch automatisch für gerecht.','Sie entscheidet nur nach dem lautesten Jubel.','Sie prüft auch die Bedürfnisse anderer Kinder.'],2,'Jule berücksichtigt verschiedene Folgen und Interessen. Ein beliebter Wunsch ist noch nicht automatisch für alle gut.'],['Wie könnte Jule aus dem Wunsch einen realistischen ersten Schritt machen?',['Ein Probeprojekt vorschlagen und Rückmeldungen sammeln.','Ab morgen ohne Absprache alle Schulregeln abschaffen.','Nur warten, bis ihre Krone echte Macht bekommt.'],0,'Ein abgesprochenes Probeprojekt ist ein machbarer Schritt. Rückmeldungen helfen, die Folgen zu beurteilen.']]},
{title:'Fall 4 · Die Stadt der Düfte',paragraphs:['In einer erfundenen Stadt orientieren sich Menschen vor allem durch Gerüche. Straßen haben Duftzeichen. Die Bibliothek riecht nach Minze, der Bahnhof nach Zitrone. Zunächst wirkt das wie eine praktische Idee. Doch an windigen Tagen vermischen sich die Düfte. Außerdem riechen manche Menschen wenig oder gar nichts.','Die Stadt ergänzt deshalb ertastbare Wegzeichen und hörbare Ansagen. Das Gedankenspiel führt zu einer Frage über unsere wirkliche Welt: Für wen funktionieren unsere Orientierungshilfen gut, und wer braucht andere Zugänge?'],questions:[['Welche Erkenntnis lässt sich aus dem Gedankenspiel übertragen?',['Orientierung muss für verschiedene Fähigkeiten zugänglich sein.','Unsere echten Straßen sollten nur noch Duftzeichen haben.','Gerüche sind immer zuverlässiger als alle anderen Sinne.'],0,'Der Fall macht sichtbar, dass eine einzige Art der Orientierung nicht für alle Menschen gleich gut funktioniert.'],['Warum sind die zusätzlichen Hilfen im Fall sinnvoll?',['Sie verhindern, dass Menschen überhaupt noch riechen.','Sie ersetzen die erfundene Stadt durch einen Traum.','Sie verringern die Abhängigkeit von einem einzigen Sinn.'],2,'Tastzeichen und Ansagen bieten weitere Wege. Das hilft bei Wind und bei eingeschränktem Geruchssinn.']]},
{title:'Fall 5 · Schäume oder Ideenquelle?',paragraphs:['Nach einem Traum zeichnet Lea ein Fahrrad mit Flügeln. Ihr Bruder lacht: „Träume sind Schäume. Das kann nie fliegen, also ist die Zeichnung nutzlos.“ Lea behauptet nicht, dass ihr Fahrrad wirklich fliegen könnte. Sie mag die Idee, freier und umweltfreundlicher unterwegs zu sein.','Sie entwickelt daraus einen Vorschlag für sichere Radwege zur Schule. Der Traum war kein fertiger Bauplan und keine Vorhersage. Trotzdem hat die Fantasie eine Frage angestoßen, aus der ein umsetzbarer Vorschlag entstanden ist.'],questions:[['Welcher Denkfehler steckt im Urteil des Bruders?',['Er hält den Traum für eine sichere Zukunftsvorhersage.','Er verwechselt fehlende wörtliche Umsetzbarkeit mit völliger Nutzlosigkeit.','Er erkennt, dass Fahrradflügel noch kein Bauplan sind.'],1,'Eine Fantasie muss nicht wörtlich umsetzbar sein, um neue Gedanken und Fragen anzuregen.'],['Welche Aussage fasst den Fall am besten zusammen?',['Jeder Traum wird wahr, wenn man fest daran glaubt.','Nur realistische Träume dürfen ernst genommen werden.','Fantasie kann eine Idee anstoßen; ihre Umsetzung muss geprüft werden.'],2,'Lea übernimmt nicht alles aus dem Traum. Sie entwickelt daraus einen realistischen Vorschlag.']]}
];

let state={passed:[false,false,false,false],best:[0,0,0,0]};try{const s=JSON.parse(localStorage.getItem('traumArcade7_static_v5'));if(s&&s.passed?.length===4&&s.best?.length===4)state=s}catch(e){}
let mode=-1,index=0,locked=false,score=0,review=false,page=0,pages=[],blocks=[];

function canStart(i){return i===0||state.passed[i-1]}
function tabs(){document.getElementById('tabs').innerHTML=names.map((n,i)=>`<button ${canStart(i)?'':'disabled'} class="${mode===i?'active':''}" onclick="start(${i})">${state.passed[i]?'✓':canStart(i)?i+1+'.':'🔒'} ${n}<small>${i===3?'Zusatz · 5 Fälle / 10 Fragen':i===2?'5 Denkfragen':'5 Fragen'}${!canStart(i)?' · vorher 70 %':''}</small></button>`).join('')}
function setScreen(label,arr,status=''){document.getElementById('label').textContent=label;document.getElementById('status').textContent=status;blocks=arr;page=0;paginate()}
function paginate(){const screen=document.getElementById('screen');const measure=document.createElement('div');measure.className='measure';measure.innerHTML=blocks.join('');screen.appendChild(measure);const limit=screen.clientHeight;pages=[];let group=[],used=0;Array.from(measure.children).forEach(el=>{const h=el.getBoundingClientRect().height; if(group.length&&used+14+h>limit-4){pages.push(group);group=[];used=0}group.push(el.outerHTML);used+=h+(group.length>1?14:0)});if(group.length)pages.push(group);measure.remove();if(!pages.length)pages=[[]];page=Math.min(page,pages.length-1);showPage()}

function start(i){if(!canStart(i))return;mode=i;index=0;score=0;locked=false;review=false;tabs();if(i===3)readCase();else render()}
function getItems(){return mode===0?sort:mode===1?tf:head}
function render(){locked=false;if(mode===3){expertQuestion();return}const items=getItems();if(index>=items.length){finish();return}const q=items[index],opinion=false;setScreen(names[mode],[`<div>${art(q[0],q[1])}<h2>${q[2]}</h2>${opinion?'<p class="muted">Deine Meinung · ohne Punkte</p>':''}</div>`,...q[3].map((a,j)=>`<button class="answer" onclick="answer(${j})"><b>${String.fromCharCode(65+j)}</b> ${a}</button>`) ],`${index+1} / ${items.length}`)}
function answer(j){if(locked)return;locked=true;const q=getItems()[index],correct=j===q[4];if(correct)score++;setScreen(correct?'✨ Richtig!':'🔎 Weiterlernen',[`<h2>${correct?'Gut erkannt!':'Die passende Antwort: '+q[3][q[4]]}</h2>`,`<p class="feedback">${q[5]}</p>`,`<button onclick="next()">Nächste Aufgabe →</button>`])}
function next(){if(!locked)return;index++;render()}
function readCase(){if(index>=10){finish();return}const c=experts[Math.floor(index/2)];setScreen('🏅 Expertenmission',[`<h2>${c.title}</h2>`,...c.paragraphs.map(p=>`<p>${p}</p>`),`<button onclick="expertQuestion()">${review?'Zurück zur Frage →':'Fall gelesen – zur Denkfrage →'}</button>`],`Fall ${Math.floor(index/2)+1} / 5`)}
function expertQuestion(){locked=false;review=false;const c=experts[Math.floor(index/2)],q=c.questions[index%2];setScreen('🏅 Expertenmission',[`<h2>${q[0]}</h2>`,...q[1].map((a,j)=>`<button class="answer" onclick="expertAnswer(${j})"><b>${String.fromCharCode(65+j)}</b> ${a}</button>`),`<button class="secondary" onclick="review=true;readCase()">Fall noch einmal lesen</button>`],`Frage ${index+1} / 10`)}
function expertAnswer(j){if(locked)return;locked=true;const q=experts[Math.floor(index/2)].questions[index%2],correct=j===q[2];if(correct)score++;setScreen(correct?'✨ Stark kombiniert!':'🔎 Genau hinschauen',[`<h2>${correct?'Deine Schlussfolgerung passt!':'Die passende Antwort: '+q[1][q[2]]}</h2>`,`<p class="feedback">${q[3]}</p>`,`<button onclick="expertNext()">Weiter →</button>`],`Frage ${index+1} / 10`)}
function expertNext(){if(!locked)return;index++;if(index>=10)finish();else if(index%2===0)readCase();else expertQuestion()}
function finish(){const total=mode===3?10:5,needed=Math.ceil(total*.7),pass=score>=needed;state.best[mode]=Math.max(state.best[mode],score);if(pass)state.passed[mode]=true;save();const percent=Math.round(score/total*100);setScreen(names[mode],[`<h2>${pass?'🎉 Mission geschafft!':'Fast geschafft – noch eine Runde!'}</h2>`,`<p class="score ${pass?'pass':'fail'}">${score} / ${total} · ${percent} %</p>`,`<p>${pass?mode===3?'Du hast die Expertenmission gemeistert!':mode===2?'Die Grundmissionen sind geschafft. Wenn du früher fertig bist, wartet die freiwillige Expertenmission.':'Die nächste Mission ist freigeschaltet.':`Zum Freischalten brauchst du ${needed} von ${total} richtigen Antworten. Lies die Rückmeldungen und versuche es erneut.`}</p>`,`<div class="choices">${pass&&mode<3?`<button onclick="start(${mode+1})">${mode===2?'Expertenmission starten 🏅':'Nächste Mission →'}</button>`:''}<button class="secondary" onclick="start(mode)">Mission wiederholen ↻</button></div>`,...(pass&&mode>=2?['<p class="muted">Bereit für Kahoot oder Blooket? Eure Lehrkraft startet die gemeinsame Spielrunde.</p>']:[])])}
function resetAll(){if(confirm('Alle Freischaltungen auf diesem Gerät zurücksetzen?')){state={passed:[false,false,false,false],best:[0,0,0,0]};save();home()}}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(paginate,100)});home();document.fonts?.ready.then(paginate);
</script></body></html>
